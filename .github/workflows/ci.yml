name: ci

# clone 一発で全環境が揃うことを継続的に担保する（#20）。
# links.prop の src 欠落・plist 構文エラー・Brewfile 破損・シェル構文エラーを
# 手元の bootstrap 実行前に検知する。副作用なし（ln/sudo/launchctl/brew bundle は実行しない）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS: 本体の dry-run テスト（plutil/launchctl を使うため macos runner が必須）
  macos-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap dry-run test
        run: bash install/test_bootstrap_dry_run.sh
      - name: shell syntax check (bash)
        run: |
          bash -n install/bootstrap.sh
          for f in install/cli-tools/*.sh; do bash -n "$f"; done
      - name: shell syntax check (zsh functions & installers)
        run: |
          for f in zsh/functions/*; do zsh -n "$f" || exit 1; done
          for f in install/*.zsh; do zsh -n "$f" || exit 1; done
      # shellcheck: 構文チェックでは拾えない論理バグ（未クオート変数・$* 連結・[ ] 誤り）を検出する（#51）。
      # まずは非ブロッキング（|| true）でレポートのみ。warning を潰してから将来 -S error で強制化する。
      - name: shellcheck (non-blocking / レポートのみ)
        run: |
          brew install shellcheck
          # bash/sh シバンを持つスクリプトだけを対象にする（Python CLI・vendored john は除外）
          files=()
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '(bash|/bin/sh|env sh)' && files+=("$f")
          done < <(find install scripts -type f ! -name '*.py' ! -path '*/john/*' ! -path '*/wordlists/*')
          printf 'shellcheck target:\n'; printf '  %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}" || true
      # Brewfile の健全性: formula/cask 名のタイポや削除済みパッケージを検知する（#51）。
      # CI runner には未インストールなので check は差分を出すが、|| true で非ブロッキングにする。
      - name: Brewfile check (non-blocking)
        run: brew bundle check --file=install/Brewfile --verbose || true

  # Linux/WSL: 単一 repo で両 OS を賄う構成を継続的に担保する。
  # このジョブが無いと、macOS だけを見た変更で静かに片肺へ戻る（#32 で実際に起きた）。
  linux-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: shell syntax check
        run: |
          bash -n install/bootstrap.sh
          for f in install/cli-tools/*.sh; do bash -n "$f"; done
          for f in zsh/functions/*; do zsh -n "$f" || exit 1; done
          zsh -n zsh/zshrc && zsh -n zsh/exports.sh && zsh -n zsh/aliases.sh && zsh -n zsh/zshenv
      # dry-run は両 OS 対応にしてあるので Linux でも実行する。
      # 検査の実体を1箇所（節[10]）に置き、両 OS の CI が同じ不変条件を通る構造にする。
      - name: bootstrap dry-run test
        run: bash install/test_bootstrap_dry_run.sh
      - name: Aptfile structure
        run: |
          grep -q '^\[wsl\]' install/Aptfile   || { echo "Aptfile: [wsl] セクションが無い"; exit 1; }
          grep -q '^\[linux\]' install/Aptfile || { echo "Aptfile: [linux] セクションが無い"; exit 1; }
          for pkg in xclip xdg-utils; do
            grep -q "^${pkg}$" install/Aptfile || { echo "Aptfile: $pkg が無い（純 Linux の一部機能が動かない）"; exit 1; }
          done
      - name: single-bootstrap invariant (2本立てへの逆戻りを防ぐ)
        run: |
          if [ -f install/bootstrap-linux.sh ]; then
            echo "install/bootstrap-linux.sh が存在する。OS 分岐は bootstrap.sh 1本に統合する方針"; exit 1
          fi
          grep -q 'IS_MAC' install/bootstrap.sh || { echo "bootstrap.sh に OS 判定が無い"; exit 1; }
      # 検査対象は設定・スクリプト領域に限る。docs/ や CLAUDE.md は規約の説明のため
      # 語そのものを含むので対象外（この workflow 自身も同様）。
      - name: single-path invariant (OS 別ディレクトリへの逆戻りを防ぐ)
        run: |
          scan="zsh install scripts git tmux ssh claude karabiner vscode ghostty"
          # shellcheck disable=SC2086
          if git grep -qI 'dotfiles-linux' -- $scan ':!install/test_bootstrap_dry_run.sh'; then
            echo "OS 別の配置パスへの参照が設定/スクリプトに残っている（両 OS とも ~/dotfiles に統一する）"
            git grep -nI 'dotfiles-linux' -- $scan ':!install/test_bootstrap_dry_run.sh'
            exit 1
          fi
